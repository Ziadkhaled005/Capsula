name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://capsula.prognil.com
      - name: Docker image builds
        run: docker build -t superadmincapsula:ci .
